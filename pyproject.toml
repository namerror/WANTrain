[project]
name = "wantrain"
version = "0.1.0"
description = "Experimental distributed PyTorch training runtime for heterogeneous WAN-like environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.7",
    "torch>=2.3",
    "torchvision>=0.18",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
wantrain = "wantrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

