# Same actual synthetic workload as scheduling_demo.yaml.
# Only Job B's scheduler-visible receiving-stage compute estimates change:
# forward stage 1: 6 -> 12 ms; backward stage 0: 3 -> 6 ms.
link:
  capacity_mib_per_ms: 1.0
  delivery_delay_ms: 0.0

jobs:
  - name: A
    start_ms: 0.0
    microbatches: 4
    forward_ms: [2.0, 2.0]
    backward_ms: [2.0, 2.0]
    activation_mib: 6.0
    gradient_mib: 6.0

  - name: B
    start_ms: 0.0
    microbatches: 4
    forward_ms: [3.0, 6.0]
    backward_ms: [3.0, 6.0]
    profile_forward_ms: [3.0, 12.0]
    profile_backward_ms: [6.0, 6.0]
    activation_mib: 2.0
    gradient_mib: 2.0
